# Variables resolve from `infra/observability/.env` (auto-loaded by
# docker compose). Defaults shown via `${VAR:-default}` so the stack
# still boots even if .env is missing.

services:
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: tip-prometheus
    user: root
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    environment:
      # Comma-separated list of `host:port` to scrape. Edit in .env, no
      # need to touch prometheus.yml. The entrypoint below converts this
      # into the file_sd_configs targets file at container startup.
      - TIP_NODE_TARGETS=${TIP_NODE_TARGETS:-host.docker.internal:4000,host.docker.internal:4100,host.docker.internal:4200}
      - PROM_RETENTION=${PROM_RETENTION:-7d}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        # Generate file_sd targets.json from comma-separated TIP_NODE_TARGETS.
        echo "$$TIP_NODE_TARGETS" | awk -v RS=, '
          BEGIN { printf "[{\"targets\":[" }
          { gsub(/[ \t\r\n]/, ""); if (length($$0)) printf "%s\"%s\"", (cnt++ ? "," : ""), $$0 }
          END   { printf "]}]\n" }
        ' > /etc/prometheus/tip-targets.json
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time="$$PROM_RETENTION" \
          --web.enable-lifecycle
    ports:
      - "${PROM_HTTP_PORT:-9090}:9090"
    extra_hosts:
      # Lets the container reach TIP nodes running on the host (Mac/Linux).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: tip-grafana
    ports:
      - "${GF_HTTP_PORT:-3030}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_ANON_ENABLED:-true}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_DEFAULT_THEME=dark
      - GF_LOG_LEVEL=warn
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/tip-home.json
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
      - TIP_API_BASE_URL=${TIP_API_BASE_URL:-http://host.docker.internal:4000}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - graf-data:/var/lib/grafana
    extra_hosts:
      # Lets the Infinity datasource reach a TIP node's API on the host.
      - "host.docker.internal:host-gateway"
    depends_on:
      - prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.0
    container_name: tip-loki
    volumes:
      - ./prod/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "127.0.0.1:${LOKI_HTTP_PORT:-3100}:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.3.0
    container_name: tip-promtail-local
    volumes:
      - ./promtail-local.yml:/etc/promtail/config.yml:ro
      - ../../node/logs:/tip-logs:ro
      - promtail-positions:/positions
    command: ["-config.file=/etc/promtail/config.yml"]
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  prom-data:
  graf-data:
  loki-data:
  promtail-positions:
