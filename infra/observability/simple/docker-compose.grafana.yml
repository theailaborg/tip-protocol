services:
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: tip-obs-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - obs-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - obs

  loki:
    image: grafana/loki:3.3.0
    container_name: tip-obs-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ../prod/loki-config.yml:/etc/loki/loki-config.yml:ro
      - obs-loki-data:/loki
    ports:
      # private interface only: node2/node3 promtail push here, never public
      - "10.0.0.4:3100:3100"
    networks:
      - obs

  grafana:
    image: grafana/grafana:11.3.0
    container_name: tip-obs-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${OBS_DOMAIN}
      # Infinity datasource resolves this; empty = every Infinity panel shows No data.
      TIP_API_BASE_URL: ${TIP_API_BASE_URL}
      # The TIP dashboards query the node API through Infinity; without this the
      # plugin is absent and every panel errors with "Could not find plugin".
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource 3.7.1
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - obs-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - obs

  caddy:
    image: caddy:2
    container_name: tip-obs-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      OBS_DOMAIN: ${OBS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - grafana
    networks:
      - obs

networks:
  obs:
    driver: bridge

volumes:
  obs-loki-data:
  obs-prometheus-data:
  obs-grafana-data:
  caddy-data:
  caddy-config:
